version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: saas_postgres
    environment:
      POSTGRES_DB: saas_production
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: admin_master_password_456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/00_init_roles_and_extensions.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_admin -d saas_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_dedicated_test:
    image: pgvector/pgvector:pg16
    container_name: saas_postgres_dedicated_test
    environment:
      POSTGRES_DB: saas_enterprise_tenant
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: admin_master_password_456
    ports:
      - "5433:5432"
    volumes:
      - postgres_dedicated_data:/var/lib/postgresql/data
      - ../migrations/00_init_roles_and_extensions.sql:/docker-entrypoint-initdb.d/00_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: saas_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: saas_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_dev_pwd
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: saas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  postgres_dedicated_data:
  redis_data:
  clickhouse_data:
  minio_data:
