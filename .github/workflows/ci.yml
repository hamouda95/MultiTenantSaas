name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Build, Lint & Multi-Tenant Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: saas_production
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: admin_master_password_456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm --filter @saas/types build

      - name: Compile API Service
        run: pnpm --filter @saas/api build

      - name: Run Automated Test Suite (RLS, Guards, Placement & E2E)
        run: pnpm --filter @saas/api test
