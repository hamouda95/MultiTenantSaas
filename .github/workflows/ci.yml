name: SaaS validation
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: saas_production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_admin -d saas_production"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgresql://saas_app_user:ci_app_password@localhost:5432/saas_production
      DATABASE_MIGRATION_URL: postgresql://saas_control:ci_control_password@localhost:5432/saas_production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: bash -n scripts/local.sh
      - name: Initialize real PostgreSQL schema and restricted roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci_admin_password
          POSTGRES_USER: saas_admin
          POSTGRES_DB: saas_production
          APP_DATABASE_PASSWORD: ci_app_password
          CONTROL_DATABASE_PASSWORD: ci_control_password
        run: |
          sed 's|/migrations/|infra/migrations/|g' infra/docker/init-database.sh > /tmp/init-saas.sh
          sh /tmp/init-saas.sh
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm --filter @saas/api test:integration
      - name: Verify Docker configuration and build both images
        env:
          POSTGRES_PASSWORD: ci_admin_password
          APP_DATABASE_PASSWORD: ci_app_password
          CONTROL_DATABASE_PASSWORD: ci_control_password
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.local.yml config --quiet
          docker compose build
          docker compose -f compose.yml -f compose.local.yml up -d --wait
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/login > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/auth/me)" = 401
          node -e "fetch('http://127.0.0.1:3000/api/v1/auth/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({padding:'x'.repeat(200000)})}).then(r=>{if(r.status!==413)process.exit(1)})"
      - name: Render combined-container readiness smoke
        env:
          POSTGRES_PASSWORD: ci_admin_password
          APP_DATABASE_PASSWORD: ci_app_password
          CONTROL_DATABASE_PASSWORD: ci_control_password
        run: |
          docker compose -f compose.yml -f compose.local.yml -f compose.ci.yml up -d --build --wait render-smoke
          curl --fail http://127.0.0.1:3100/health/ready
          curl --fail http://127.0.0.1:3100/login > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/v1/auth/me)" = 401
      - name: Real browser business workflow and responsive screenshots
        run: |
          npm install --prefix /tmp/saas-browser --no-audit --no-fund playwright@1.58.2
          node /tmp/saas-browser/node_modules/playwright/cli.js install --with-deps chromium
          NODE_PATH=/tmp/saas-browser/node_modules node scripts/business-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Deployment smoke logs and cleanup
        if: always()
        env:
          POSTGRES_PASSWORD: ci_admin_password
          APP_DATABASE_PASSWORD: ci_app_password
          CONTROL_DATABASE_PASSWORD: ci_control_password
        run: |
          docker compose -f compose.yml -f compose.local.yml -f compose.ci.yml logs --tail 80
          docker compose -f compose.yml -f compose.local.yml -f compose.ci.yml down --volumes --remove-orphans

  neon-compatible:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: ci_admin_password
          POSTGRES_DB: saas_production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_admin -d saas_production"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: saas_admin
      PGPASSWORD: ci_admin_password
      PGDATABASE: saas_production
      JWT_SECRET: ci-neon-only-secret-at-least-32-characters
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgresql://saas_runtime:ci_app_password@localhost:5432/saas_production
      DATABASE_MIGRATION_URL: postgresql://saas_control:ci_control_password@localhost:5432/saas_production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh infra/neon/init-ci.sh
      - run: pnpm --filter @saas/types build
      - run: pnpm --filter @saas/api build
      - run: pnpm --filter @saas/api test:integration
