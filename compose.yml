services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: saas_production
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      CONTROL_DATABASE_PASSWORD: ${CONTROL_DATABASE_PASSWORD:?Set CONTROL_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/migrations:ro
      - ./infra/docker/init-database.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U saas_admin -d saas_production']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_URL: ${WEB_URL:?Set public HTTPS origin}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET of at least 32 characters}
      DATABASE_URL: postgresql://saas_app_user:${APP_DATABASE_PASSWORD}@postgres:5432/saas_production
      DATABASE_MIGRATION_URL: postgresql://saas_control:${CONTROL_DATABASE_PASSWORD}@postgres:5432/saas_production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
