services:
  render-smoke:
    build:
      context: .
      target: render
    environment:
      JWT_SECRET: ci-render-secret-at-least-32-characters
      WEB_URL: https://ci.example.test
      DATABASE_URL: postgresql://saas_app_user:${APP_DATABASE_PASSWORD}@postgres:5432/saas_production
      DATABASE_MIGRATION_URL: postgresql://saas_control:${CONTROL_DATABASE_PASSWORD}@postgres:5432/saas_production
    ports:
      - "127.0.0.1:3100:10000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:10000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 7s
      retries: 20
